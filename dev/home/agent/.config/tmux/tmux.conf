# Goal: tmux is only here to own the sandbox's ptys. Make it invisible and let
# kitty do scrollback, mouse selection and copying natively.

set -g default-shell /bin/zsh
set -g default-terminal tmux-256color
set -g status off                 # no bar at all
set -g mouse off                  # mouse belongs to kitty (native select / copy / wheel)
set -g history-limit 200000
set -s escape-time 0              # don't swallow ESC (nvim, alt+key)
set -g focus-events on
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-passthrough on       # kitty graphics / OSC sequences reach kitty
set -s extended-keys on           # apps that ask for the kitty keyboard protocol get it
set -s set-clipboard on           # OSC 52 from inside (nvim "+y etc.) reaches kitty's clipboard
set -as terminal-features ',xterm-kitty:RGB:clipboard:focus:title:hyperlinks:usstyle:extkeys:overline:strikethrough'

# Don't switch kitty to its alternate screen. Everything tmux draws then goes
# into kitty's own scrollback, so the wheel, scroll-to-search, select-to-copy
# all work exactly as without tmux.
set -as terminal-overrides ',xterm-kitty:smcup@:rmcup@'

# One kitty window == one shell: closing the window kills its shell, like a
# normal terminal would.
set -g destroy-unattached on
set -g exit-empty off             # server stays up when the last session dies
